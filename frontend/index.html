<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mark Attendance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <div class="navbar">
    <h2>📋 Attendance Management System</h2>
    <div class="nav-links">
      <a href="index.html">Mark Attendance</a>
      <a href="view.html">View Attendance</a>
      <a href="dashboard.html">Dashboard</a>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <div class="container">
    <h3>Mark Attendance</h3>

    <!-- ATTENDANCE TABLE -->
    <table>
      <thead>
        <tr>
          <th>Enrollment No</th>
          <th>Student Name</th>

      <tbody id="studentTable">
        <!-- JS yahan students inject karega -->
      </tbody>

    <button class="save-btn" onclick="saveAttendance()">
      Save Attendance
    </button>
  </div>

  <script src="script.js"></script>
